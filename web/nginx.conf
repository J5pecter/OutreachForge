server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets with SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API + public unsubscribe/tracking endpoints to the api service on the
  # compose network. `api` resolves via Docker DNS.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /u/ { proxy_pass http://api:4000; }
  location ~ ^/o/ { proxy_pass http://api:4000; }
}
